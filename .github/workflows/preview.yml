name: Preview

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

# Vercel preview deploys are handled automatically via the native GitHub integration.
# This workflow only runs tests. Vercel posts the preview URL comment on its own.

jobs:
  # ──────────────────────────────────────────────────────────────────
  # Run all Vitest tests against the PR branch
  # Vercel's native integration will NOT deploy if this check fails
  # when "Required Checks" is configured in the Vercel project settings.
  # ──────────────────────────────────────────────────────────────────
  test:
    name: Vitest — Unit Tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Run tests with coverage
        run: npm test -- --coverage
        env:
          NEXT_PUBLIC_SUPABASE_URL:      https://olybgkhggqnmrfcjjojy.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im9seWJna2hnZ3FubXJmY2pqb2p5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzcyMTY5NTcsImV4cCI6MjA5Mjc5Mjk1N30.cPsp03NU6KiRE0gWQwkD_kWNpyrjSqBn-8OoJTe3Rh4
          SUPABASE_SERVICE_ROLE_KEY:     ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          OPENAI_API_KEY:                ${{ secrets.OPENAI_API_KEY }}
          GROQ_API_KEY:                  ${{ secrets.GROQ_API_KEY }}
          NEXT_PUBLIC_APP_URL:           ${{ secrets.VERCEL_PREVIEW_URL || 'http://localhost:3000' }}

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ github.sha }}
          path: coverage/
          retention-days: 14
