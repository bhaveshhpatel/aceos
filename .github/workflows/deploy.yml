name: Deploy

on:
  push:
    branches: [main]

jobs:
  # ──────────────────────────────────────────────────────────────
  # Run tests first — deploy only if they pass
  # ──────────────────────────────────────────────────────────────
  test:
    name: Vitest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Run tests
        run: npm test -- --coverage
        env:
          NEXT_PUBLIC_SUPABASE_URL:      https://olybgkhggqnmrfcjjojy.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im9seWJna2hnZ3FubXJmY2pqb2p5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzcyMTY5NTcsImV4cCI6MjA5Mjc5Mjk1N30.cPsp03NU6KiRE0gWQwkD_kWNpyrjSqBn-8OoJTe3Rh4
          SUPABASE_SERVICE_ROLE_KEY:     ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          OPENAI_API_KEY:                ${{ secrets.OPENAI_API_KEY }}
          GROQ_API_KEY:                  ${{ secrets.GROQ_API_KEY }}
          NEXT_PUBLIC_APP_URL:           https://aceos-ai.vercel.app

  # ──────────────────────────────────────────────────────────────
  # Deploy to Vercel production
  # ──────────────────────────────────────────────────────────────
  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: test
    environment:
      name: production
      url: https://aceos-ai.vercel.app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Pull Vercel environment
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID:     ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Build project
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID:     ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Deploy to production
        run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID:     ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
