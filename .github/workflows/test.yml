name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Vitest
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Run tests with coverage
        run: npm test -- --coverage
        env:
          # Supabase (public values only — safe to expose in CI)
          NEXT_PUBLIC_SUPABASE_URL:      https://olybgkhggqnmrfcjjojy.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im9seWJna2hnZ3FubXJmY2pqb2p5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzcyMTY5NTcsImV4cCI6MjA5Mjc5Mjk1N30.cPsp03NU6KiRE0gWQwkD_kWNpyrjSqBn-8OoJTe3Rh4
          # Secrets injected from GitHub repo secrets
          SUPABASE_SERVICE_ROLE_KEY:     ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          OPENAI_API_KEY:                ${{ secrets.OPENAI_API_KEY }}
          GROQ_API_KEY:                  ${{ secrets.GROQ_API_KEY }}
          MODAL_SANDBOX_URL:             ${{ secrets.MODAL_SANDBOX_URL }}
          MODAL_API_KEY:                 ${{ secrets.MODAL_API_KEY }}
          NEXT_PUBLIC_APP_URL:           https://aceos-ai.vercel.app

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
          retention-days: 7
